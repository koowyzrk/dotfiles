$mainMod = SUPER
$shiftMod = SHIFT
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu 
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad) kitty
bind = $mainMod, S, togglespecialworkspace, kitty
bind = $mainMod SHIFT, S, movetoworkspace, special:kitty

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = CTRL, right, resizeactive, 70 0
bind = CTRL, left, resizeactive, -70 0
bind = CTRL, up, resizeactive, 0 -70
bind= CTRL, down, resizeactive, 0 70
bind = $mainMod CONTROL, 1, exec, hyprctl dispatch moveworkspacetomonitor 1 current
bind = $mainMod CONTROL, 2, exec, hyprctl dispatch moveworkspacetomonitor 2 current
bind = $mainMod CONTROL, 3, exec, hyprctl dispatch moveworkspacetomonitor 3 current
bind = $mainMod CONTROL, 4, exec, hyprctl dispatch moveworkspacetomonitor 4 current
bind = $mainMod CONTROL, 5, exec, hyprctl dispatch moveworkspacetomonitor 5 current
bind = $mainMod CONTROL, 6, exec, hyprctl dispatch moveworkspacetomonitor 6 current
# waybar relaunch
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
# brightness
bind =, XF86MonBrightnessUp, exec, brightnessctl set +10
bind =, XF86MonBrightnessDown, exec, brightnessctl set 10-
# volume 
bindel=, XF86AudioRaiseVolume, exec, amixer -D pulse sset Master 5%+
bindel=, XF86AudioLowerVolume, exec, amixer -D pulse sset Master 5%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# screenshot
bind = $mainMod SHIFT, C, exec, grimblast copy area
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output -o /home/kwzrk/screenshots/ -z
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region
# zen
bind = $mainMod, z, exec, zen-browser
